version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-organizer-backend-prod
    ports:
      - "18080:18080"
    env_file:
      - .env
    volumes:
      - ./backend/data:/app/data
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: ai-organizer-frontend-prod
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

networks:
  default:
    name: ai-organizer-network-prod
